[project]
name = "event-parser-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "S", email = "s.free.engineer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "trafilatura>=2.2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
event-parser = "event_parser_llm.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
